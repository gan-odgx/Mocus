# Builds an unsigned Mocus.ipa on GitHub's macOS runners, so no Mac is needed.
# Sideload the IPA with SideStore / AltStore / Sideloadly / LiveContainer; they sign it.
#  - Every push to main and every manual run: download from the run's "Artifacts".
#  - Pushing a tag like v1.1.0 also publishes a GitHub Release with the IPA attached.
name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      # The checked-in Locus.xcodeproj predates the new files; regenerate from project.yml.
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -quiet \
            -project Locus.xcodeproj \
            -target Locus \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/Locus.app Payload/
          zip -qry Mocus.ipa Payload
          ls -lh Mocus.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Mocus-ipa
          path: Mocus.ipa

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Mocus.ipa \
            --title "Mocus $GITHUB_REF_NAME" \
            --notes "Монгол хувилбар + мобайл датаар холбогдох горим. / Mongolian edition with a mobile-data connection mode."
